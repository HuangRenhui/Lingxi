lingxi:
  jwt:
    # 仅开发环境使用内置默认密钥；生产环境请在 application.yml 之外通过 JWT_SECRET 覆盖。
    secret: ${JWT_SECRET:lingxi-dev-secret-key-change-in-production-0123456789}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lingxi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3s

logging:
  level:
    com.lingxi.mapper: debug
