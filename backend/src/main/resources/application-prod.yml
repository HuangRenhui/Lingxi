spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  lifecycle:
    # 发布/重启时等待在途请求完成，避免直接掐断连接
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      # Lettuce 默认读超时 60s：Redis 挂起时每个请求会阻塞一分钟，必须显式收紧
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:3000ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms

server:
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false

knife4j:
  production: true

logging:
  level:
    com.lingxi: info
