server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lingxi-backend
  profiles:
    # 默认走 dev 便于本地开箱运行；生产部署必须通过 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    # 未匹配到处理器时抛出 NoHandlerFoundException，交由全局异常处理返回统一结构
    throw-exception-if-handler-not-found: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

lingxi:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 注入密钥；未配置时应用启动失败。
    # 开发环境的默认密钥仅在 application-dev.yml 中提供。
    secret: ${JWT_SECRET:}
    expire-minutes: 720
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.lingxi: info
